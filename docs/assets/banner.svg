<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>

    <!-- Swahili Accent Gradients -->
    <linearGradient id="kenya-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" /> <!-- Nyekundu -->
      <stop offset="35%" stop-color="#10B981" /> <!-- Kijani -->
      <stop offset="70%" stop-color="#3B82F6" /> <!-- Buluu -->
      <stop offset="100%" stop-color="#F59E0B" /> <!-- Njano -->
    </linearGradient>

    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid-pattern)" />

  <!-- Abstract Canvas Objects (Left/Right Accents) -->
  <g opacity="0.85">
    <!-- Architecture Frame -->
    <rect x="830" y="45" width="320" height="230" rx="10" fill="url(#card-glow)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Nairobi Fintech Card 1 -->
    <rect x="860" y="75" width="120" height="65" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)" />
    <text x="875" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#93C5FD">M-PESA C2B</text>
    <text x="875" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">SLA &lt; 400ms</text>

    <!-- Node 2 (KRA eTIMS) -->
    <rect x="1005" y="75" width="115" height="65" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#shadow)" />
    <text x="1020" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6EE7B7">eTIMS Engine</text>
    <text x="1020" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Fiscalization</text>

    <!-- Swahili Sticky Note (Njano) -->
    <rect x="870" y="165" width="110" height="85" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" transform="rotate(-3 925 207)" filter="url(#shadow)" />
    <text x="880" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B45309">Mashinani Sync</text>
    <text x="880" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#78350F">Offline queue for</text>
    <text x="880" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#78350F">rural POS drops</text>

    <!-- Real-time Collaborative Cursor 1 (Amina) -->
    <g transform="translate(980, 150)">
      <path d="M0,0 L0,18 L4.5,13.5 L9.5,23 L13.5,21 L8.5,11.5 L15,11.5 Z" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5" />
      <rect x="16" y="8" width="82" height="20" rx="4" fill="#EC4899" />
      <text x="22" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Amina (Nairobi)</text>
    </g>

    <!-- Real-time Collaborative Cursor 2 (Juma) -->
    <g transform="translate(1040, 220)">
      <path d="M0,0 L0,18 L4.5,13.5 L9.5,23 L13.5,21 L8.5,11.5 L15,11.5 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" />
      <rect x="16" y="8" width="90" height="20" rx="4" fill="#3B82F6" />
      <text x="22" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Juma (Mombasa)</text>
    </g>
  </g>

  <!-- Typography & Brand (Left Column) -->
  <g transform="translate(70, 75)">
    <!-- Kenyan National & Design Palette Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#10B981" />
    <text x="28" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">KENYA REAL-TIME CANVAS</text>

    <!-- Brand Name with Swahili Gradient Accent Underline -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#F8FAFC" letter-spacing="-1">
      SKETCHBOARD
    </text>
    <rect x="2" y="88" width="310" height="4" rx="2" fill="url(#kenya-accent)" />

    <!-- Subtitle / Mission -->
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
      Figma-grade collaborative canvas powered by Yjs CRDTs over Socket.io.
    </text>
    <text x="0" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748B">
      Built for distributed product squads across Nairobi, Mombasa &amp; Kisumu.
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="82" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Yjs CRDT</text>

      <rect x="92" y="0" width="88" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="103" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80">HTML5 Canvas</text>

      <rect x="190" y="0" width="102" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="201" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Redis Hot-Log</text>

      <rect x="302" y="0" width="85" height="24" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="313" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#C084FC">PostgreSQL</text>
    </g>
  </g>
</svg>
