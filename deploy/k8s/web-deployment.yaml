apiVersion: apps/v1
kind: Deployment
metadata:
  name: sketchboard-web
  namespace: sketchboard
  labels:
    app: sketchboard-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sketchboard-web
  template:
    metadata:
      labels:
        app: sketchboard-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/crnjihia/sketchboard-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
