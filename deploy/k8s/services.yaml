apiVersion: v1
kind: Service
metadata:
  name: sketchboard-server-service
  namespace: sketchboard
  labels:
    app: sketchboard-server
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: sketchboard-server
---
apiVersion: v1
kind: Service
metadata:
  name: sketchboard-web-service
  namespace: sketchboard
  labels:
    app: sketchboard-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: sketchboard-web
