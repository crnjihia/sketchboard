map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sketchboard_servers {
    # Sticky sessions via client IP hash (required for Socket.io HTTP long-polling fallback)
    ip_hash;
    server server-1:4000 max_fails=3 fail_timeout=10s;
    server server-2:4000 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;
    server_name localhost;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Socket.io Cluster Proxy with WebSocket Upgrade
    location /socket.io/ {
        proxy_pass http://sketchboard_servers;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for real-time collaboration
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Health & Metrics Endpoints
    location ~ ^/(healthz|readyz|metrics)$ {
        proxy_pass http://sketchboard_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend Static UI
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
