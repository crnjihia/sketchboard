name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sketchboard_secret
          POSTGRES_DB: sketchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.9.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Lint and Typecheck
        run: pnpm run build

      - name: Run Test Suites (Vitest)
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://postgres:sketchboard_secret@localhost:5432/sketchboard
          ENABLE_REDIS: "true"
          ENABLE_POSTGRES: "true"
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Multi-Browser Collaboration E2E
        run: pnpm test:e2e

      - name: Upload Hero Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-screenshot
          path: docs/assets/hero-screenshot.png
          if-no-files-found: ignore

      - name: Run Chaos Test (Server Failover & 0 Edit Loss)
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm test:chaos

      - name: Run Cluster Load Test
        run: pnpm test:load

      - name: Build Docker Server Image
        run: docker build -f Dockerfile.server -t ghcr.io/${{ github.repository }}/server:latest .

      - name: Build Docker Web Image
        run: docker build -f Dockerfile.web -t ghcr.io/${{ github.repository }}/web:latest .

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository }}/server:latest
          docker push ghcr.io/${{ github.repository }}/web:latest

  k8s-smoke-test:
    runs-on: ubuntu-latest
    needs: [test-and-verify]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 2-node Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: sketchboard-ci
          config: deploy/k8s/kind-config.yaml
          wait: 120s

      - name: Build local container images
        run: |
          docker build -f Dockerfile.server -t ghcr.io/sketchboard/server:latest .
          docker build -f Dockerfile.web -t ghcr.io/sketchboard/web:latest .

      - name: Load images into Kind nodes
        run: |
          kind load docker-image ghcr.io/sketchboard/server:latest --name sketchboard-ci
          kind load docker-image ghcr.io/sketchboard/web:latest --name sketchboard-ci

      - name: Deploy Sketchboard via Kustomize
        run: |
          kubectl apply -k deploy/k8s
          kubectl rollout status deployment/sketchboard-server -n sketchboard --timeout=180s
          kubectl rollout status deployment/sketchboard-web -n sketchboard --timeout=180s

      - name: Verify Kubernetes Cluster State
        run: |
          kubectl get pods -n sketchboard -o wide
          kubectl get services -n sketchboard
          kubectl get ingress -n sketchboard
